<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NEXUS · BLE Tactical Radar</title>
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0f' stroke='%2300ff87' stroke-width='1.5'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%2360efff' stroke-width='1.2'/%3E%3Cpath d='M20 42 L32 14 L44 42 M25.5 32 H38.5' fill='none' stroke='%2300ff87' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='3.2' fill='%23ff0080'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --g: #00ff87;
  --c: #60efff;
  --p: #ff0080;
  --y: #ffcc00;
  --bg: #0a0a0f;
}
body { background: var(--bg); color: #e5e7eb; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: hidden; }
.nexus-stamp { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; border-bottom: 1px solid #00ff8733; }
.nexus-chip { font-size: 0.65rem; letter-spacing: 0.12em; color: var(--c); text-transform: uppercase; }
.nexus-stamp h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.08em; color: var(--g); text-shadow: 0 0 12px #00ff8766; margin: 0; }
.nexus-stamp p { font-size: 0.7rem; color: #9ca3af; margin: 0; }
.glow { text-shadow: 0 0 8px currentColor; }
.blip-fav { filter: drop-shadow(0 0 6px var(--y)); }
canvas { display: block; touch-action: none; }
.panel { background: #0f0f16cc; border: 1px solid #00ff8733; backdrop-filter: blur(8px); }
.mode-btn { border: 1px solid #ffffff22; transition: all 0.15s; }
.mode-btn.active { border-color: var(--g); color: var(--g); box-shadow: 0 0 12px #00ff8755; }
.target-row { border-left: 3px solid transparent; }
.target-row.selected { border-left-color: var(--c); background: #60efff11; }
.target-row.fav { border-left-color: var(--y); }
.spark { image-rendering: pixelated; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #00ff8744; border-radius: 3px; }
</style>
</head>
<body class="h-screen flex flex-col">
<!-- NEXUS header stamp -->
<header class="nexus-stamp" data-brand="NExtended Xperimental USers">
  <div>
    <div class="nexus-chip">DoubleA · AntManThePro</div>
    <h1>NEXUS</h1>
    <p>NExtended Xperimental USers</p>
  </div>
  <svg width="56" height="56" viewBox="0 0 64 64" aria-label="NEXUS sigil">
    <rect width="64" height="64" rx="14" fill="#0a0a0f" stroke="#00ff87" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="19" fill="none" stroke="#60efff" stroke-width="1.2"/>
    <path d="M20 42 L32 14 L44 42 M25.5 32 H38.5" fill="none" stroke="#00ff87" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="32" r="3.2" fill="#ff0080"/>
  </svg>
</header>

<div class="flex-1 flex flex-col md:flex-row overflow-hidden">
  <!-- Radar viewport -->
  <div class="flex-1 relative min-h-0">
    <canvas id="radar" class="w-full h-full"></canvas>
    <div class="absolute top-3 left-3 panel px-3 py-2 text-xs">
      <div id="status-line" class="text-[#00ff87] glow font-bold">● SIM TELEMETRY · no radio</div>
      <div id="mode-line" class="text-[#60efff] mt-0.5">MODE: PRECISION</div>
      <div id="target-count" class="text-[#ffcc00]">TARGETS: 0</div>
    </div>
    <div class="absolute bottom-3 left-3 right-3 md:right-auto panel px-3 py-2 text-[10px] text-gray-400 max-w-md">
      Distances are RSSI estimates via log-distance path loss. No AoA without multi-antenna arrays. Native owns the antenna.
    </div>
  </div>

  <!-- Side panel -->
  <div class="w-full md:w-96 flex flex-col border-t md:border-t-0 md:border-l border-[#00ff8733] bg-[#0a0a0f]">
    <!-- Controls -->
    <div class="p-3 border-b border-[#00ff8733] space-y-2">
      <div class="flex flex-wrap gap-1.5">
        <button id="btn-scan" class="mode-btn px-3 py-1.5 text-xs rounded">START SCAN</button>
        <button id="btn-stop" class="mode-btn px-3 py-1.5 text-xs rounded opacity-50">STOP</button>
        <button id="btn-pulse" class="mode-btn px-3 py-1.5 text-xs rounded">PULSE</button>
        <button id="btn-favs" class="mode-btn px-3 py-1.5 text-xs rounded">FAVS ONLY</button>
      </div>
      <div class="flex flex-wrap gap-1.5">
        <button data-mode="eco" class="mode-btn px-2.5 py-1 text-[10px] rounded">ECO</button>
        <button data-mode="precision" class="mode-btn active px-2.5 py-1 text-[10px] rounded">PRECISION</button>
        <button data-mode="street" class="mode-btn px-2.5 py-1 text-[10px] rounded">STREET</button>
        <button data-mode="pro" class="mode-btn px-2.5 py-1 text-[10px] rounded">PRO TOOLS</button>
      </div>
      <div id="pro-tools" class="hidden text-[10px] space-y-1 pt-1">
        <label class="flex items-center gap-2">n=<input id="n-slider" type="range" min="1.8" max="4.0" step="0.1" value="2.4" class="flex-1"> <span id="n-val">2.4</span></label>
        <label class="flex items-center gap-2">Tx=<input id="tx-slider" type="range" min="-70" max="-40" step="1" value="-59" class="flex-1"> <span id="tx-val">-59</span> dBm</label>
        <button id="btn-export" class="mode-btn px-2 py-1 rounded w-full">EXPORT STATE JSON</button>
      </div>
    </div>

    <!-- Target list -->
    <div class="flex-1 overflow-y-auto p-2 space-y-1" id="target-list">
      <div class="text-center text-xs text-gray-500 py-8">No signals</div>
    </div>

    <!-- Detail -->
    <div id="detail" class="border-t border-[#00ff8733] p-3 text-xs hidden">
      <div class="flex justify-between items-start">
        <div>
          <div id="d-name" class="text-[#60efff] font-bold"></div>
          <div id="d-type" class="text-[10px] text-gray-400"></div>
        </div>
        <button id="d-fav" class="text-xl leading-none">☆</button>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-2 text-[10px]">
        <div>MAC <div id="d-mac" class="text-[#ffcc00] font-mono"></div></div>
        <div>DIST <div id="d-dist" class="text-[#00ff87] font-mono"></div></div>
        <div>RSSI <div id="d-rssi" class="text-[#ff0080] font-mono"></div></div>
        <div>TX <div id="d-tx" class="font-mono"></div></div>
      </div>
      <div class="mt-2 text-[10px] text-gray-500">HEX TELEMETRY</div>
      <div id="d-hex" class="font-mono text-[10px] text-[#60efff] break-all"></div>
      <div class="mt-2 text-[10px] text-gray-500">RSSI HISTORY (LAST 40)</div>
      <canvas id="spark" width="320" height="40" class="w-full h-10 spark bg-black/40 rounded"></canvas>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('radar');
  const ctx = canvas.getContext('2d', { alpha: true });
  const spark = document.getElementById('spark');
  const sctx = spark.getContext('2d');

  let W, H, CX, CY, R;
  let sweep = 0;
  let mode = 'precision';
  let favsOnly = false;
  let scanning = false;
  let bleScan = null;
  let realRadio = false;
  let pathLossN = 2.4;
  let defaultTx = -59;
  let selectedId = null;
  let pulseUntil = 0;

  const devices = new Map();
  const TYPES = ['AUDIO','BEACON','WEARABLE','PHONE','SENSOR','TRACKER','UNKNOWN'];
  const NAMES = {
    AUDIO: ['AirPods Pro','Sony WH','Galaxy Buds','Bose QC'],
    BEACON: ['Smart Tag','Tile','iBeacon','BLE Beacon'],
    WEARABLE: ['Fitness Band','Nordic Sensor','Apple Watch','Whoop'],
    PHONE: ['iPhone','Pixel','Galaxy','Unknown Phone'],
    SENSOR: ['Temp Probe','Door Sensor','Motion','Humidity'],
    TRACKER: ['AirTag','Chipolo','Unknown Tracker','Pet Collar'],
    UNKNOWN: ['Unknown Peripheral','Hidden Device','???']
  };

  function resize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = rect.width * dpr;
    H = canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    CX = rect.width / 2;
    CY = rect.height / 2;
    R = Math.min(CX, CY) * 0.88;
  }
  window.addEventListener('resize', resize);
  resize();

  // EMA filter
  function ema(prev, next, alpha = 0.22) {
    return prev == null ? next : prev * (1 - alpha) + next * alpha;
  }

  function estimateDistance(rssi, tx, n) {
    const d = Math.pow(10, (tx - rssi) / (10 * n));
    return Math.max(0.1, Math.min(50, d));
  }

  function makeFakeDevice() {
    const type = TYPES[Math.floor(Math.random() * TYPES.length)];
    const names = NAMES[type];
    const name = names[Math.floor(Math.random() * names.length)] + (Math.random() > 0.6 ? ' ' + Math.floor(Math.random()*99).toString().padStart(2,'0') : '');
    const mac = Array.from({length:6}, () => Math.floor(Math.random()*256).toString(16).padStart(2,'0').toUpperCase()).join(':');
    const baseRssi = -45 - Math.random() * 45;
    return {
      id: mac,
      name,
      type,
      mac,
      angle: Math.random() * Math.PI * 2,
      rawRssi: baseRssi,
      smoothedRssi: baseRssi,
      txPower: defaultTx + (Math.random()-0.5)*8,
      distance: 1,
      history: [],
      lastSeen: Date.now(),
      favorite: false,
      hex: Array.from({length:4}, () => '0x'+Math.floor(Math.random()*65536).toString(16).toUpperCase().padStart(4,'0')).join(' ')
    };
  }

  function seedSim() {
    for (let i = 0; i < 6; i++) devices.set(crypto.randomUUID(), makeFakeDevice());
  }
  seedSim();

  // Persist favorites
  function loadFavs() {
    try {
      const saved = JSON.parse(localStorage.getItem('nexus-ble-favs') || '[]');
      saved.forEach(id => {
        const d = devices.get(id);
        if (d) d.favorite = true;
      });
    } catch(e){}
  }
  function saveFavs() {
    const favs = Array.from(devices.values()).filter(d => d.favorite).map(d => d.id);
    localStorage.setItem('nexus-ble-favs', JSON.stringify(favs));
  }
  loadFavs();


  async function startScan() {
    if (!navigator.bluetooth) {
      setStatus('● NO WEB BLUETOOTH · SIM ONLY', true);
      scanning = true;
      return;
    }
    try {
      setStatus('● REQUESTING LE SCAN…', false);
      bleScan = await navigator.bluetooth.requestLEScan({
        acceptAllAdvertisements: true,
        keepRepeatedDevices: true
      });
      realRadio = true;
      scanning = true;
      setStatus('● LIVE RADIO · ADVERTISEMENTS', false);
      navigator.bluetooth.addEventListener('advertisementreceived', onAdv);
    } catch (e) {
      console.warn(e);
      realRadio = false;
      scanning = true;
      setStatus('● SIM TELEMETRY · radio denied or flag off', true);
      if (e.name === 'NotAllowedError') {
        setStatus('● PERMISSION DENIED · enable chrome://flags/#enable-experimental-web-platform-features', true);
      }
    }
  }

  function stopScan() {
    if (bleScan && bleScan.active) bleScan.stop();
    scanning = false;
    realRadio = false;
    setStatus('● SCAN STOPPED · SIM IDLE', true);
  }

  function onAdv(event) {
    const id = event.device.id;
    const name = event.device.name || 'Unknown Peripheral';
    const raw = event.rssi;
    const tx = event.txPower ?? defaultTx;
    let dev = devices.get(id);
    if (!dev) {
      dev = {
        id, name, type: 'UNKNOWN', mac: id.slice(0,17),
        angle: Math.random() * Math.PI * 2,
        rawRssi: raw, smoothedRssi: raw, txPower: tx,
        distance: 1, history: [], lastSeen: Date.now(),
        favorite: false,
        hex: '0x' + Math.abs(raw).toString(16).toUpperCase()
      };
      devices.set(id, dev);
    }
    dev.rawRssi = raw;
    dev.smoothedRssi = ema(dev.smoothedRssi, raw, mode === 'eco' ? 0.12 : 0.25);
    dev.txPower = tx;
    dev.lastSeen = Date.now();
    dev.distance = estimateDistance(dev.smoothedRssi, dev.txPower, pathLossN);
    dev.history.push(dev.smoothedRssi);
    if (dev.history.length > 40) dev.history.shift();
  }

  function setStatus(text, isSim) {
    const el = document.getElementById('status-line');
    el.textContent = text;
    el.className = isSim ? 'text-[#ffcc00] glow font-bold' : 'text-[#00ff87] glow font-bold';
  }

  function updateSim() {
    if (!scanning || realRadio) return;
    const now = Date.now();
    devices.forEach(dev => {
      // Random walk + occasional jitter
      const jitter = (Math.random() - 0.5) * (mode === 'street' ? 6 : 3);
      dev.rawRssi = Math.max(-95, Math.min(-30, dev.rawRssi + jitter * 0.15 + (Math.random()-0.5)*0.4));
      dev.smoothedRssi = ema(dev.smoothedRssi, dev.rawRssi, mode === 'eco' ? 0.1 : 0.2);
      // Slow angle drift for visual life (no real AoA)
      dev.angle += (Math.random()-0.5) * 0.008;
      dev.distance = estimateDistance(dev.smoothedRssi, dev.txPower, pathLossN);
      dev.history.push(dev.smoothedRssi);
      if (dev.history.length > 40) dev.history.shift();
      dev.lastSeen = now;
    });
    // Occasional new device
    if (Math.random() < 0.004 && devices.size < 12) {
      const d = makeFakeDevice();
      devices.set(d.id, d);
    }
    // Expire old
    for (const [id, d] of devices) {
      if (now - d.lastSeen > 18000) devices.delete(id);
    }
  }

  function draw() {
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);

    // Rings
    ctx.strokeStyle = '#00ff8722';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 4; i++) {
      ctx.beginPath();
      ctx.arc(CX, CY, R * i / 4, 0, Math.PI * 2);
      ctx.stroke();
    }
    // Cross
    ctx.beginPath();
    ctx.moveTo(CX - R, CY); ctx.lineTo(CX + R, CY);
    ctx.moveTo(CX, CY - R); ctx.lineTo(CX, CY + R);
    ctx.strokeStyle = '#60efff18';
    ctx.stroke();

    // Sweep
    const speed = mode === 'eco' ? 0.012 : mode === 'pro' ? 0.028 : 0.02;
    sweep += speed;
    const grad = ctx.createConicalGradient ? ctx.createConicalGradient(sweep, CX, CY) : null;
    // Fallback radial sweep arc
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(sweep);
    const g = ctx.createLinearGradient(0, 0, R, 0);
    g.addColorStop(0, '#00ff8700');
    g.addColorStop(0.7, '#00ff8744');
    g.addColorStop(1, '#60efff88');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, R, -0.25, 0.25);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Pulse ring
    if (Date.now() < pulseUntil) {
      const t = (pulseUntil - Date.now()) / 800;
      ctx.beginPath();
      ctx.arc(CX, CY, R * (1 - t) * 0.6, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,0,128,${t})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Blips
    const maxDist = 30;
    devices.forEach(dev => {
      if (favsOnly && !dev.favorite) return;
      const age = (Date.now() - dev.lastSeen) / 1000;
      if (age > 15) return;
      const distNorm = Math.min(1, dev.distance / maxDist);
      const x = CX + Math.cos(dev.angle) * R * distNorm;
      const y = CY + Math.sin(dev.angle) * R * distNorm;
      const alpha = Math.max(0.15, 1 - age / 12);
      const isSel = dev.id === selectedId;
      const size = isSel ? 7 : (dev.favorite ? 5.5 : 4);

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = isSel ? 18 : 10;
      ctx.shadowColor = dev.favorite ? '#ffcc00' : (isSel ? '#60efff' : '#00ff87');
      ctx.fillStyle = dev.favorite ? '#ffcc00' : (isSel ? '#60efff' : '#00ff87');
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
      // Inner core
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0a0a0f';
      ctx.beginPath();
      ctx.arc(x, y, size * 0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (isSel || distNorm < 0.35) {
        ctx.fillStyle = '#e5e7ebcc';
        ctx.font = '10px ui-monospace';
        ctx.fillText(dev.name.split(' ')[0], x + 8, y - 6);
      }
    });

    // Center
    ctx.fillStyle = '#ff0080';
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#ff0080';
    ctx.beginPath();
    ctx.arc(CX, CY, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    updateSim();
    updateUI();
    requestAnimationFrame(draw);
  }

  function updateUI() {
    document.getElementById('mode-line').textContent = `MODE: ${mode.toUpperCase()}`;
    document.getElementById('target-count').textContent = `TARGETS: ${devices.size}`;
    const list = document.getElementById('target-list');
    const arr = Array.from(devices.values())
      .filter(d => !favsOnly || d.favorite)
      .sort((a,b) => a.distance - b.distance);
    if (arr.length === 0) {
      list.innerHTML = '<div class="text-center text-xs text-gray-500 py-8">No signals</div>';
    } else {
      list.innerHTML = arr.map(d => `
        <div class="target-row ${d.id===selectedId?'selected':''} ${d.favorite?'fav':''} p-2 rounded cursor-pointer hover:bg-white/5" data-id="${d.id}">
          <div class="flex justify-between items-center">
            <div>
              <div class="text-sm ${d.favorite?'text-[#ffcc00]':'text-gray-200'}">${d.name}</div>
              <div class="text-[10px] text-gray-500">${d.type} · ${d.distance.toFixed(1)}m</div>
            </div>
            <div class="text-right">
              <div class="text-[#ff0080] font-mono text-xs">${Math.round(d.smoothedRssi)}</div>
              <div class="text-[10px] text-gray-600">${d.favorite?'★':'☆'}</div>
            </div>
          </div>
        </div>
      `).join('');
    }
    // Detail
    const sel = selectedId ? devices.get(selectedId) : null;
    const det = document.getElementById('detail');
    if (sel) {
      det.classList.remove('hidden');
      document.getElementById('d-name').textContent = sel.name;
      document.getElementById('d-type').textContent = 'TYPE: ' + sel.type;
      document.getElementById('d-mac').textContent = sel.mac;
      document.getElementById('d-dist').textContent = sel.distance.toFixed(2) + ' m';
      document.getElementById('d-rssi').textContent = Math.round(sel.smoothedRssi) + ' dBm';
      document.getElementById('d-tx').textContent = Math.round(sel.txPower) + ' dBm';
      document.getElementById('d-hex').textContent = sel.hex;
      document.getElementById('d-fav').textContent = sel.favorite ? '★' : '☆';
      // Spark
      sctx.clearRect(0,0,320,40);
      if (sel.history.length > 1) {
        sctx.strokeStyle = '#60efff';
        sctx.lineWidth = 1.5;
        sctx.beginPath();
        const min = Math.min(...sel.history) - 2;
        const max = Math.max(...sel.history) + 2;
        sel.history.forEach((v,i) => {
          const x = (i / (sel.history.length-1)) * 320;
          const y = 38 - ((v - min) / (max - min)) * 36;
          i===0 ? sctx.moveTo(x,y) : sctx.lineTo(x,y);
        });
        sctx.stroke();
      }
    } else {
      det.classList.add('hidden');
    }
  }

  // Events
  document.getElementById('btn-scan').onclick = startScan;
  document.getElementById('btn-stop').onclick = stopScan;
  document.getElementById('btn-pulse').onclick = () => { pulseUntil = Date.now() + 800; };
  document.getElementById('btn-favs').onclick = () => { favsOnly = !favsOnly; document.getElementById('btn-favs').classList.toggle('active', favsOnly); };

  document.querySelectorAll('[data-mode]').forEach(btn => {
    btn.onclick = () => {
      mode = btn.dataset.mode;
      document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('pro-tools').classList.toggle('hidden', mode !== 'pro');
      if (mode === 'street') pathLossN = 2.0;
      else if (mode === 'precision') pathLossN = 2.6;
      else if (mode === 'eco') pathLossN = 2.2;
      document.getElementById('n-slider').value = pathLossN;
      document.getElementById('n-val').textContent = pathLossN.toFixed(1);
    };
  });

  document.getElementById('n-slider').oninput = e => {
    pathLossN = parseFloat(e.target.value);
    document.getElementById('n-val').textContent = pathLossN.toFixed(1);
  };
  document.getElementById('tx-slider').oninput = e => {
    defaultTx = parseInt(e.target.value);
    document.getElementById('tx-val').textContent = defaultTx;
  };

  document.getElementById('btn-export').onclick = () => {
    const state = {
      mode, pathLossN, defaultTx, realRadio,
      devices: Array.from(devices.values()).map(d => ({
        name: d.name, type: d.type, mac: d.mac,
        rssi: Math.round(d.smoothedRssi), dist: +d.distance.toFixed(2),
        favorite: d.favorite, angle: +d.angle.toFixed(3)
      }))
    };
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nexus-ble-radar-state.json';
    a.click();
  };

  document.getElementById('target-list').onclick = e => {
    const row = e.target.closest('[data-id]');
    if (!row) return;
    selectedId = row.dataset.id;
  };
  document.getElementById('d-fav').onclick = () => {
    const sel = devices.get(selectedId);
    if (sel) { sel.favorite = !sel.favorite; saveFavs(); }
  };

  // Start loop
  document.addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); scanning ? stopScan() : startScan(); }
    if (e.key === 'f' || e.key === 'F') { favsOnly = !favsOnly; document.getElementById('btn-favs').classList.toggle('active', favsOnly); }
    if (e.key === 'Escape') selectedId = null;
  });
  draw();
